<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tracklet</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img src="icons/logo-blue.svg" class="logo" alt="" width="20" height="19" />
      <span class="title">Tracklet</span>
      <a id="open-app" class="open-app" href="#" target="_blank" hidden>Open app</a>
    </header>

    <main id="view">
      <p id="status" class="status" role="status"></p>

      <!-- Mode tabs — auto-picked from the tab URL (Jira → ticket, GitHub PR → PR) -->
      <div id="tabs" class="tabs" role="tablist" aria-label="Action" hidden>
        <button type="button" id="tab-ticket" class="tab selected" role="tab" aria-selected="true">
          Track ticket
        </button>
        <button type="button" id="tab-pr" class="tab" role="tab" aria-selected="false">
          Add PR
        </button>
      </div>

      <section id="ticket" hidden>
        <label class="label" for="jira-url">Jira ticket URL</label>
        <input
          id="jira-url"
          type="url"
          placeholder="https://team.atlassian.net/browse/DEV-101"
          autocomplete="off"
          spellcheck="false"
        />
        <p id="ticket-preview" class="preview" hidden></p>

        <span class="label">Category</span>
        <div class="pills" role="radiogroup" aria-label="Category">
          <button type="button" class="pill selected" data-cat="DEVELOPMENT" role="radio" aria-checked="true">
            Development
          </button>
          <button type="button" class="pill" data-cat="SUPPORT" role="radio" aria-checked="false">
            Support
          </button>
        </div>

        <button id="track" class="primary" type="button">Track this ticket</button>
      </section>

      <section id="pr" hidden>
        <label class="label" for="pr-url">GitHub PR URL</label>
        <input
          id="pr-url"
          type="url"
          placeholder="https://github.com/owner/repo/pull/123"
          autocomplete="off"
          spellcheck="false"
        />
        <p id="pr-preview" class="preview" hidden></p>

        <label class="label" for="tracker-search">Attach to tracker</label>
        <input
          id="tracker-search"
          type="search"
          placeholder="Search ticket ID…"
          autocomplete="off"
          spellcheck="false"
        />
        <div id="tracker-list" class="list" role="listbox" aria-label="Trackers"></div>

        <button id="add-pr" class="primary" type="button" disabled>Add PR</button>
      </section>

      <section id="confirm" hidden>
        <p id="confirm-text" class="confirm-text"></p>
        <div class="row">
          <button id="confirm-yes" class="primary" type="button">Yes, do it</button>
          <a id="open-existing" class="secondary" href="#" target="_blank">Open existing</a>
        </div>
      </section>

      <section id="done" hidden>
        <p id="done-text" class="confirm-text ok"></p>
        <a id="open-tracker" class="primary link" href="#" target="_blank">Open tracker</a>
      </section>

      <section id="signin" hidden>
        <p class="confirm-text">Sign in to Tracklet first — then try again.</p>
        <a id="signin-link" class="primary link" href="#" target="_blank">Sign in</a>
      </section>
    </main>

    <script src="config.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
